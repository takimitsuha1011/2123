<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FDF8EC" />
  <title>Make a Birthday Wish 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cake.css" />
</head>
<body>
  <a class="back-link" href="digital-vault.html">← Back to your birthday letters</a>

  <main class="birthday-card">
    <header class="page-header">
      <p class="eyebrow">One more little surprise</p>
      <h1>Your Birthday Cake <span aria-hidden="true">🎂</span></h1>
      <p class="intro">Close your eyes, make a wish, and get ready for a sweet little celebration.</p>
    </header>

    <section class="wish-section" aria-labelledby="wish-heading">
      <button id="wish-button" class="soft-button" type="button" aria-expanded="false" aria-controls="wish-form">Make a wish ✨</button>
      <form id="wish-form" class="wish-form" hidden>
        <label for="wish-input">What's your birthday wish?</label>
        <div class="wish-entry">
          <input id="wish-input" name="wish" maxlength="120" autocomplete="off" placeholder="Keep it secret or share it..." required />
          <button class="soft-button" type="submit">Save my wish</button>
        </div>
      </form>
      <p id="wish-message" class="wish-message" role="status" aria-live="polite"></p>
    </section>

    <section class="candle-section" aria-labelledby="candle-heading">
      <h2 id="candle-heading">A birthday cake made just for you</h2>
      <p id="cake-instruction" class="instruction">Light the candles, make a wish, and blow them out!</p>
      <div class="cake-stage">
        <div id="cake" class="cake" role="button" tabindex="0" aria-disabled="true" aria-label="Birthday cake. Light and blow out the candles before taking a slice.">
          <div class="cake-plate"></div>
          <div class="tier tier-bottom">
            <div class="tier-side">
              <span class="tier-filling"></span>
              <span class="tier-drip drip-a"></span><span class="tier-drip drip-b"></span>
              <span class="tier-drip drip-c"></span><span class="tier-drip drip-d"></span>
              <span class="cake-decoration decoration-a">🌼</span><span class="cake-decoration decoration-b">🍓</span>
              <span class="cake-decoration decoration-c">⭐</span><span class="cake-decoration decoration-d">🫐</span>
              <span class="cake-gap" aria-hidden="true"></span>
            </div>
            <div class="tier-cap">
              <span class="berry berry-a"></span><span class="berry berry-b"></span><span class="berry berry-c"></span>
            </div>
          </div>
          <div class="tier tier-middle">
            <div class="tier-side">
              <span class="tier-filling"></span>
              <span class="tier-drip drip-a"></span><span class="tier-drip drip-b"></span>
              <span class="tier-drip drip-c"></span><span class="tier-drip drip-d"></span>
              <span class="cake-decoration decoration-a">🌸</span><span class="cake-decoration decoration-b">🍓</span>
              <span class="cake-decoration decoration-c">🫐</span>
            </div>
            <div class="tier-cap">
              <span class="berry berry-a"></span><span class="berry berry-b"></span>
            </div>
          </div>
          <div class="tier tier-top">
            <div class="tier-side">
              <span class="tier-filling"></span>
              <span class="tier-drip drip-a"></span><span class="tier-drip drip-b"></span>
              <span class="tier-drip drip-c"></span>
              <span class="cake-decoration decoration-a">🌼</span><span class="cake-decoration decoration-b">🍒</span>
            </div>
            <div class="tier-cap">
              <span class="berry berry-a"></span><span class="berry berry-b"></span>
            </div>
            <div class="candles" aria-label="Four birthday candles">
              <span class="candle candle-a"><span class="flame"></span><span class="wick"></span></span>
              <span class="candle candle-b"><span class="flame"></span><span class="wick"></span></span>
              <span class="candle candle-c"><span class="flame"></span><span class="wick"></span></span>
              <span class="candle candle-d"><span class="flame"></span><span class="wick"></span></span>
            </div>
          </div>
        </div>
        <div id="cake-slice" class="cake-slice" aria-hidden="true">
          <svg class="slice-art" viewBox="0 0 220 190" role="img" aria-label="A slice of three-layer strawberry cake with cream frosting">
            <defs>
              <linearGradient id="slice-sponge" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#63352f" />
                <stop offset="0.5" stop-color="#754239" />
                <stop offset="1" stop-color="#482824" />
              </linearGradient>
              <linearGradient id="slice-crust" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#442521" />
                <stop offset="0.5" stop-color="#714039" />
                <stop offset="1" stop-color="#38201e" />
              </linearGradient>
              <linearGradient id="slice-top" x1="0" x2="0.8" y1="0" y2="1">
                <stop offset="0" stop-color="#fffef5" />
                <stop offset="0.72" stop-color="#fff7e9" />
                <stop offset="1" stop-color="#ead1b5" />
              </linearGradient>
              <pattern id="slice-crumb" width="13" height="12" patternUnits="userSpaceOnUse">
                <circle cx="3" cy="4" r="1" fill="#d39b69" opacity="0.38" />
                <circle cx="10" cy="9" r="0.8" fill="#2e1a18" opacity="0.35" />
              </pattern>
              <clipPath id="slice-face-clip">
                <path d="M15 104 L205 47 L205 139 Z" />
              </clipPath>
              <filter id="slice-shadow" x="-25%" y="-20%" width="155%" height="165%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
                <feOffset dx="2" dy="5" />
                <feComponentTransfer><feFuncA type="linear" slope="0.23" /></feComponentTransfer>
                <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
            </defs>
            <g filter="url(#slice-shadow)" stroke="#633c32" stroke-linejoin="round" stroke-width="2">
              <path d="M15 104 L205 47 L205 139 Z" fill="url(#slice-sponge)" />
              <path d="M15 104 L205 47 L205 139 Z" fill="url(#slice-crumb)" stroke="none" />
              <g clip-path="url(#slice-face-clip)" stroke="#d8b890" stroke-width="1.2">
                <path d="M0 95 L220 29 L220 43 L0 109 Z" fill="#fff0d0" />
                <path d="M0 119 L220 53 L220 67 L0 133 Z" fill="#fff0d0" />
              </g>
              <path d="M15 104 L145 20 Q181 10 205 47 L15 104 Z" fill="url(#slice-top)" />
              <path d="M15 104 L145 20 Q181 10 205 47 L15 104 Z" fill="none" stroke="#b79a80" />
              <path d="M22 100 L145 22 Q174 14 195 43" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity="0.9" stroke-width="3" />
            </g>
            <path d="M72 58 C77 48 92 48 97 57 C104 54 111 61 109 68 C107 75 96 76 90 71 C83 78 70 74 69 67 C68 63 69 60 72 58Z" fill="url(#slice-top)" stroke="#d6b6a1" stroke-width="2" />
            <path d="M78 61 C85 57 95 57 102 62 M80 67 C87 64 95 64 102 67" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity="0.8" stroke-width="2" />
            <g fill="#c84f67" stroke="#a13d58" stroke-width="1">
              <circle cx="45" cy="87" r="5" />
              <circle cx="126" cy="38" r="4.5" />
            </g>
            <path d="M44 82 l-3 -5 M46 82 l2 -5 M47 83 l5 -3" fill="none" stroke="#648859" stroke-linecap="round" stroke-width="1.7" />
            <circle cx="43" cy="85" r="1.3" fill="#ffd8b8" stroke="none" />
          </svg>
        </div>
      </div>
      <p id="candle-status" class="status-message" role="status" aria-live="polite">Your candles are waiting to be lit. 🕯️</p>
      <div class="controls">
        <button id="light-button" class="primary-button" type="button">🕯️ Light the candles</button>
        <button id="blow-button" class="primary-button" type="button" hidden>💨🎤 Blow out the candles</button>
        <button id="manual-blow-button" class="text-button" type="button" hidden>💨 Tap here to blow them out instead</button>
      </div>
    </section>
  </main>

  <script src="cake.js"></script>
</body>
</html>
